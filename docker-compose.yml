name: nfo_updater

services:
  nfo_updater:
    image: ghcr.io/alexls74/nfo_updater:${IMAGE_TAG:-latest}
    container_name: nfo_updater

    # unless-stopped is the only policy that also brings the service back after
    # the host reboots, which matters for something that wakes up once a week.
    restart: unless-stopped

    # A pass that is interrupted still packs the originals of the files it has
    # already rewritten into a backup archive, and that takes time on a large
    # library. The default grace period of 10 seconds would kill it halfway.
    stop_grace_period: 300s

    # Every setting lives in .env. Nothing has to be listed here, now or when a
    # future release adds a setting.
    env_file: .env

    volumes:
      # Database, logs and backup archives. Created on first start.
      - ./data:/data

      # ----------------------------------------------------------------------
      # YOUR MEDIA LIBRARY
      #
      # Replace the paths on the LEFT of each colon with your own. The right
      # side is fixed: /movies and /tvshows are where NFO Updater looks, and
      # changing them would leave it looking at nothing.
      #
      # Several source directories per category are attached as subdirectories
      # of the same mount point. The names you pick are yours; NFO Updater
      # walks everything below /movies and /tvshows recursively.
      #
      #   - /mnt/disk1/films:/movies/films
      #   - /mnt/disk2/oldies:/movies/oldies
      #   - /nas/serials:/tvshows/serials
      #   - /mnt/disk2/anime:/tvshows/anime
      #
      # They may sit on different disks and have nothing in common — the two
      # mount points are what ties them together.
      #
      # Only have one of the two categories? Delete the other line. Keeping it
      # with a wrong or made-up path is worse than not having it: Docker
      # creates whatever is missing on the host, and the mount then succeeds
      # while pointing at an empty directory.
      #
      # Read-write is required. NFO Updater edits .nfo files in place; it
      # creates no new files in the library and touches nothing else.
      # ----------------------------------------------------------------------
      - /mnt/media/movies:/movies
      - /mnt/media/tvshows:/tvshows
